    <clipPath id="clip-body"><use href="#body"/></clipPath>
    <clipPath id="clip-tile"><use href="#tile"/></clipPath>

    <linearGradient id="base" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#101a5c"/>
      <stop offset="0.5" stop-color="#0c1240"/>
      <stop offset="1" stop-color="#04111f"/>
    </linearGradient>
    <radialGradient id="o-blue"><stop offset="0" stop-color="#3b82ff"/><stop offset="1" stop-color="#3b82ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o-violet"><stop offset="0" stop-color="#c053ff"/><stop offset="1" stop-color="#c053ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o-teal"><stop offset="0" stop-color="#14e0c4"/><stop offset="1" stop-color="#14e0c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="o-pink"><stop offset="0" stop-color="#ff5a8a"/><stop offset="1" stop-color="#ff5a8a" stop-opacity="0"/></radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="frost" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="64"/>
      <feColorMatrix type="saturate" values="1.6"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.18"/><feFuncG type="linear" slope="1.18"/><feFuncB type="linear" slope="1.18"/></feComponentTransfer>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#01030f" flood-opacity="0.6"/>
    </filter>
    <filter id="gauge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000820" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.36"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="g-cpu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2563ff"/><stop offset="1" stop-color="#8ccaff"/></linearGradient>
    <linearGradient id="g-mem" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8b2cf5"/><stop offset="1" stop-color="#e8a6ff"/></linearGradient>
    <linearGradient id="g-net" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0aa896"/><stop offset="1" stop-color="#86f7e6"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.22" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffe2a8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip-body)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <g filter="url(#soft)">
      <circle cx="290" cy="280" r="330" fill="url(#o-blue)"/>
      <circle cx="790" cy="360" r="300" fill="url(#o-violet)"/>
      <circle cx="400" cy="840" r="320" fill="url(#o-teal)"/>
      <circle cx="840" cy="860" r="230" fill="url(#o-pink)" opacity="0.55"/>
    </g>
    <ellipse cx="512" cy="150" rx="470" ry="230" fill="url(#sheen)" opacity="0.5"/>
  </g>
  <use href="#body" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- frosted tile -->
  <g filter="url(#drop)"><use href="#tile" fill="#060b2a" opacity="0.32"/></g>
  <g clip-path="url(#clip-tile)">
    <g filter="url(#frost)">
      <rect x="120" y="120" width="784" height="784" fill="#18216a"/>
      <circle cx="290" cy="280" r="340" fill="url(#o-blue)"/>
      <circle cx="790" cy="360" r="320" fill="url(#o-violet)"/>
      <circle cx="400" cy="840" r="330" fill="url(#o-teal)"/>
    </g>
    <use href="#tile" fill="url(#glass)"/>
    <ellipse cx="512" cy="250" rx="330" ry="120" fill="url(#sheen)" opacity="0.6"/>
  </g>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- gauges: CPU · Memory · Network -->
  <g filter="url(#gauge-shadow)">
    <rect x="322" y="392" width="88" height="308" rx="44" fill="url(#track)"/>
    <rect x="468" y="392" width="88" height="308" rx="44" fill="url(#track)"/>
    <rect x="614" y="392" width="88" height="308" rx="44" fill="url(#track)"/>
    <rect x="322" y="486" width="88" height="214" rx="44" fill="url(#g-cpu)"/>
    <rect x="468" y="430" width="88" height="270" rx="44" fill="url(#g-mem)"/>
    <rect x="614" y="560" width="88" height="140" rx="44" fill="url(#g-net)"/>
  </g>
  <g fill="#fff" opacity="0.42">
    <rect x="338" y="500" width="14" height="140" rx="7"/>
    <rect x="484" y="444" width="14" height="180" rx="7"/>
    <rect x="630" y="574" width="14" height="80" rx="7"/>
  </g>

  <!-- activity pulse -->
  <path d="M262 596 H352 L398 596 L438 474 L490 706 L540 540 L576 596 L640 596 L674 524 L710 596 H762"
        fill="none" stroke="url(#pulse)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="762" cy="596" r="19" fill="#fff" filter="url(#glow)"/>
</svg>
