name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle launch video into the site
        run: |
          cp media/respeek-launch.mp4 site/assets/respeek-launch.mp4
          cp media/respeek-launch-poster.jpg site/assets/respeek-launch-poster.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
